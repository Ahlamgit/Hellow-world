# KHADAMATI localhost infrastructure (Gate A — not production)
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: khadamati-postgres
    environment:
      POSTGRES_DB: khadamati
      POSTGRES_USER: khadamati
      POSTGRES_PASSWORD: khadamati_dev
    ports:
      - "5432:5432"
    volumes:
      - khadamati_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khadamati -d khadamati"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: khadamati-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  khadamati_pg_data:
