# Staging stack — production-like runtime without live payment/push providers.
#
# Usage:
#   cp .env.staging.example .env.staging
#   # edit Bootstrap__* and Jwt__Secret, then:
#   ./scripts/deploy-staging.sh
#
# Or manually:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#   ./scripts/smoke-test.sh http://localhost:8080

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: khadamati-sqlserver-staging
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_staging_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: khadamati-api-staging
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection}"
      Jwt__Secret: "${Jwt__Secret}"
      Jwt__Issuer: "${Jwt__Issuer:-https://staging-api.khadamati.com}"
      Jwt__Audience: "${Jwt__Audience:-https://staging.khadamati.com}"
      Database__MigrateOnStartup: "${Database__MigrateOnStartup:-true}"
      Database__SeedDemoData: "${Database__SeedDemoData:-false}"
      Bootstrap__AdminEmail: "${Bootstrap__AdminEmail}"
      Bootstrap__AdminPassword: "${Bootstrap__AdminPassword}"
      Bootstrap__AdminPhone: "${Bootstrap__AdminPhone:-+966500000001}"
      Bootstrap__AdminFirstName: "${Bootstrap__AdminFirstName:-Staging}"
      Bootstrap__AdminLastName: "${Bootstrap__AdminLastName:-Administrator}"
      Integrations__RequireProductionReady: "false"
      AllowedHosts: "${AllowedHosts:-*}"
      Payment__Provider: Development
      Email__Provider: Development
      Sms__Provider: Development
      Push__Provider: Development
      Cors__AllowedOrigins__0: "${Cors__AllowedOrigins__0:-http://localhost:8080}"
      Cors__AllowedOrigins__1: "${Cors__AllowedOrigins__1:-http://localhost:3000}"
    ports:
      - "5001:8080"
    volumes:
      - api_staging_backups:/var/khadamati/backups
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-/api/v1}"
    container_name: khadamati-web-staging
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  sqlserver_staging_data:
  api_staging_backups:
