# Production-oriented compose stack. For local development use docker-compose.yml instead.
#
# Usage:
#   cp .env.production.example .env.production
#   # edit secrets, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Run database migrations before first deploy (when Database__MigrateOnStartup=false):
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm api \
#     dotnet ef database update --project /src/Khadamati.Infrastructure/Khadamati.Infrastructure.csproj

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: khadamati-sqlserver-prod
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: khadamati-api-prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "${ConnectionStrings__DefaultConnection}"
      Jwt__Secret: "${Jwt__Secret}"
      Jwt__Issuer: "${Jwt__Issuer}"
      Jwt__Audience: "${Jwt__Audience}"
      Database__MigrateOnStartup: "${Database__MigrateOnStartup:-false}"
      Database__SeedDemoData: "${Database__SeedDemoData:-false}"
      Integrations__RequireProductionReady: "${Integrations__RequireProductionReady:-false}"
      AllowedHosts: "${AllowedHosts}"
      Payment__Provider: "${Payment__Provider}"
      Payment__Moyasar__SecretKey: "${Payment__Moyasar__SecretKey}"
      Payment__Moyasar__PublishableKey: "${Payment__Moyasar__PublishableKey}"
      Payment__Moyasar__WebhookSecret: "${Payment__Moyasar__WebhookSecret}"
      Email__Provider: "${Email__Provider}"
      Email__SendGrid__ApiKey: "${Email__SendGrid__ApiKey}"
      Email__SendGrid__FromAddress: "${Email__SendGrid__FromAddress}"
      Sms__Provider: "${Sms__Provider}"
      Sms__Twilio__AccountSid: "${Sms__Twilio__AccountSid}"
      Sms__Twilio__AuthToken: "${Sms__Twilio__AuthToken}"
      Sms__Twilio__FromNumber: "${Sms__Twilio__FromNumber}"
      Push__Provider: "${Push__Provider}"
      Push__Firebase__ServerKey: "${Push__Firebase__ServerKey}"
      Push__Firebase__ProjectId: "${Push__Firebase__ProjectId}"
      Push__Apns__TeamId: "${Push__Apns__TeamId}"
      Push__Apns__KeyId: "${Push__Apns__KeyId}"
      Push__Apns__PrivateKey: "${Push__Apns__PrivateKey}"
      Push__Apns__UseSandbox: "${Push__Apns__UseSandbox:-false}"
      Cors__AllowedOrigins__0: "${Cors__AllowedOrigins__0}"
      Cors__AllowedOrigins__1: "${Cors__AllowedOrigins__1}"
    volumes:
      - api_backups:/var/khadamati/backups
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-/api/v1}"
    container_name: khadamati-web-prod
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver_data:
  api_backups:
